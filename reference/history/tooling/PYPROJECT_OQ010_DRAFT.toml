# OQ-010 proposal only. Do not treat as active root configuration before ADR-0009 acceptance.

[project]
name = "hullq"
version = "0.1.0"
description = "Technical-first sailboat discovery and market matching"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "coverage[toml]>=7,<8",
  "hypothesis>=6,<7",
  "mypy>=2,<3",
  "pip-audit>=2,<3",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF",
  "C4", "DTZ", "PTH", "PERF", "RET", "TRY"
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["hullq"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
