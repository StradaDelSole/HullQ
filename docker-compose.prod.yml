# SLICE-0079 production Docker Compose —
# docs/governance/PRODUCTION_READINESS_GATE.md §1.
#
# This exact file is deployed as part of one immutable release directory
# (/opt/hullq/releases/<git-commit-sha>/, alongside the matching Caddyfile,
# deploy.sh and rollback.sh from the SAME commit -- see
# docs/operations/PRODUCTION_DEPLOY_ROLLBACK_RUNBOOK.md §1/§2 for the full
# release-directory contract). Never edit a deployed copy in place; a new
# release is always a new commit's own release directory.
#
# `name:` below pins one stable Compose project name across every release
# directory. Without it, Compose derives the project name from the
# containing directory (which differs per release, since each release
# lives in its own `releases/<sha>/` directory) and `docker compose up -d`
# for a new release would start a SECOND, independent set of containers
# instead of replacing the previous release's -- both trying to bind the
# same host ports and failing. Pinning the name is what makes `up -d` from
# a different release directory correctly recreate (not duplicate) `api`/
# `web`/`caddy`.
#
# Both application images are pinned to the exact immutable OCI digest in
# $HULLQ_API_IMAGE / $HULLQ_WEB_IMAGE (independent-review Finding L: a
# mutable `sha-<commit>` TAG is not itself a mechanically immutable image
# identity -- the same tag could in principle be republished with
# different bytes by a workflow rerun/retry, and the Dockerfiles' own
# upstream base images are themselves mutable tags, so rebuilding the same
# commit later is not guaranteed to reproduce the same content). deploy.sh
# reads these two `repository@sha256:<digest>` references from its own
# release directory's `image-refs.env` -- written ONCE, at that release's
# first publish, and never overwritten by a later republish of the same
# commit (docs/operations/PRODUCTION_DEPLOY_ROLLBACK_RUNBOOK.md §1/§3) --
# never a mutable tag, never `latest`
# (docs/ARCHITECTURE_REBASELINE_2026-09-02.md §24).
#
# Stable, non-versioned runtime state (secrets, TLS certificates) lives
# outside every immutable release directory, at $HULLQ_SHARED_DIR
# (default /opt/hullq/shared) -- never committed, never copied per-release.
# Neither application container mounts a local volume for canonical data:
# PostgreSQL (DigitalOcean Managed PostgreSQL) and object storage
# (Cloudflare R2) are both externalized, so this host remains
# stateless/replaceable with respect to application data (architecture
# rebaseline §23).

name: hullq-prod

services:
  api:
    image: ${HULLQ_API_IMAGE}
    pull_policy: missing
    restart: unless-stopped
    env_file: ${HULLQ_SHARED_DIR:-/opt/hullq/shared}/.env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - hullq

  web:
    image: ${HULLQ_WEB_IMAGE}
    pull_policy: missing
    restart: unless-stopped
    env_file: ${HULLQ_SHARED_DIR:-/opt/hullq/shared}/.env
    ports:
      - "127.0.0.1:4321:4321"
    networks:
      - hullq

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HULLQ_SHARED_DIR:-/opt/hullq/shared}/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hullq
    depends_on:
      - api
      - web

networks:
  hullq: {}

volumes:
  caddy_data: {}
  caddy_config: {}
