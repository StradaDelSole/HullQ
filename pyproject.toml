[project]
name = "hullq"
version = "0.1.0"
description = "Technical-first sailboat discovery and market matching"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28.1,<1",
  "jsonschema>=4.26,<5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "coverage[toml]>=7.15.4,<8",
  "hypothesis>=6.165.9,<7",
  "mypy>=2.3.1,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.3,<1",
]

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF",
  "C4", "DTZ", "PTH", "PERF", "RET"
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
packages = ["hullq"]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["hullq"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
skip_covered = false
