name: Deploy

# SLICE-0079 — docs/governance/PRODUCTION_READINESS_GATE.md §1
# ("controlled deployment uses CI-verified immutable Docker images... in
# GHCR"). Mirrors ci.yml's trigger/pin/checkout conventions.
#
# `build` runs on every push/PR and never pushes anything -- it only proves
# both Dockerfiles still build. `push_to_ghcr` additionally pushes each
# image to GHCR, tagged with the exact immutable git commit SHA (never
# `latest` -- docs/ARCHITECTURE_REBASELINE_2026-09-02.md §24), but only on
# push to `main` or an explicit manual run: a pull_request from an
# untrusted fork must never be able to publish a package under this
# repository's GHCR namespace using `secrets.GITHUB_TOKEN`.
#
# `deploy` is manual-only (`workflow_dispatch` with `deploy: true`), gated
# behind the `production` GitHub Environment (configure required
# reviewers/secrets there before first use --
# docs/operations/PRODUCTION_DEPLOY_ROLLBACK_RUNBOOK.md). It has not been
# exercised against a real VPS by SLICE-0079 itself: that requires
# production SSH/host secrets this slice does not have access to and must
# not fabricate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy the pushed images to the production VPS (requires the production environment's secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  # A deploy in flight must never be cancelled mid-rollout by a newer push
  # -- that could leave the VPS mid-swap between two image tags.
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.image }} image (no push)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: Dockerfile
          - image: web
            context: web
            dockerfile: web/Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false

  push_to_ghcr:
    name: push ${{ matrix.image }} image to GHCR
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: Dockerfile
            ghcr_repo: hullq-api
          - image: web
            context: web
            dockerfile: web/Dockerfile
            ghcr_repo: hullq-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.ghcr_repo }}
          # Immutable exact-commit tag only -- deliberately no `latest`
          # (ARCHITECTURE_REBASELINE_2026-09-02.md §24).
          tags: type=sha,format=long

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: deploy to production VPS
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: push_to_ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "$DEPLOY_PATH/deploy.sh $IMAGE_TAG"

      - name: Post-deploy smoke check
        env:
          HULLQ_SMOKE_BASE_URL: ${{ vars.HULLQ_PRODUCTION_BASE_URL }}
        run: |
          pip install --quiet httpx
          python scripts/ops/smoke_check.py --base-url "$HULLQ_SMOKE_BASE_URL"
