name: Manufacturer artifact reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manufacturer-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: reproduce (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.14"

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Reproduce retained manufacturer artifacts
        run: |
          uv run python research/manufacturers/build_registry.py
          uv run python research/manufacturers/finalize_source_yield.py
          uv run python research/manufacturers/analyze_overlap.py
          uv run python research/manufacturers/build_report.py
          git diff --exit-code -- research/manufacturers/registry.json research/manufacturers/overlap_result.json research/manufacturers/REPORT.md
