name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.14"

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Validate repository contracts
        run: uv run python scripts/validate_repository.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test with branch coverage
        run: uv run coverage run -m pytest

      - name: Enforce coverage
        run: uv run coverage report

  db-integration:
    name: db integration (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hullq_test
          POSTGRES_PASSWORD: hullq_test
          POSTGRES_DB: hullq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.14"

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Apply migrations and run integration tests
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: uv run pytest tests/persistence/ -v

      - name: Run benchmark runner against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
          HULLQ_IMPL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          uv run python scripts/benchmark/runner.py
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
          --output research/benchmark/persistence/BENCHMARK-RESULT.json
          --report research/benchmark/persistence/BENCHMARK-REPORT.md

      - name: Validate benchmark result against schema
        run: >
          uv run python -c "
          import json, jsonschema, pathlib;
          result = json.loads(pathlib.Path('research/benchmark/persistence/BENCHMARK-RESULT.json').read_text());
          schema = json.loads(pathlib.Path('research/benchmark/persistence/result_schema.json').read_text());
          jsonschema.validate(instance=result, schema=schema);
          print('BENCHMARK-RESULT.json validates against result_schema.json');
          rec = result.get('recommendation', 'MISSING');
          print(f'Recommendation: {rec}');
          assert rec in ('G3_CANDIDATE', 'HARDEN_FIRST', 'BLOCKED'), f'Unexpected recommendation: {rec}'
          "

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-outputs
          path: |
            research/benchmark/persistence/BENCHMARK-RESULT.json
            research/benchmark/persistence/BENCHMARK-REPORT.md
          if-no-files-found: warn

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.14"

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Audit environment
        run: uv run pip-audit
