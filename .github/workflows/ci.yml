name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.14"

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Validate repository contracts
        run: uv run python scripts/validate_repository.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test with branch coverage
        run: uv run coverage run -m pytest

      - name: Enforce coverage
        run: uv run coverage report

  db-integration:
    name: db integration (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hullq_test
          POSTGRES_PASSWORD: hullq_test
          POSTGRES_DB: hullq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.14"

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Apply migrations and run integration tests
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: uv run pytest tests/persistence/ -v

      # TEMPORARY (SLICE-0045 amendment review verification only): no local
      # PostgreSQL superuser credentials are available in this session, so
      # this CI job is the only way to actually execute and observe the
      # owner-inspection script before the standalone owner-inspection
      # acceptance criterion may be checked. Removed once observed.
      - name: SLICE-0045 owner inspection (temporary verification run)
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: uv run python scripts/inspect_native_listing_offer_facts.py

      - name: Run benchmark runner against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
          HULLQ_IMPL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          uv run python scripts/benchmark/runner.py
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
          --output research/benchmark/persistence/BENCHMARK-RESULT.json
          --report research/benchmark/persistence/BENCHMARK-REPORT.md

      - name: Validate benchmark result against schema
        run: >
          uv run python -c "
          import json, jsonschema, pathlib;
          result = json.loads(pathlib.Path('research/benchmark/persistence/BENCHMARK-RESULT.json').read_text());
          schema = json.loads(pathlib.Path('research/benchmark/persistence/result_schema.json').read_text());
          jsonschema.validate(instance=result, schema=schema);
          print('BENCHMARK-RESULT.json validates against result_schema.json');
          rec = result.get('recommendation', 'MISSING');
          print(f'Recommendation: {rec}');
          assert rec == 'G3_PASS', f'Retained Stage-2 benchmark must remain exactly G3_PASS after accepted SLICE-0015 G3 passage; got: {rec}'
          "

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-outputs
          path: |
            research/benchmark/persistence/BENCHMARK-RESULT.json
            research/benchmark/persistence/BENCHMARK-REPORT.md
          if-no-files-found: warn

      - name: Validate SLICE-0017 bootstrap manifest against schema
        run: >
          uv run python -c "
          import json, jsonschema, pathlib;
          manifest = json.loads(pathlib.Path('research/bootstrap/wikidata/manifest.json').read_text());
          schema = json.loads(pathlib.Path('research/bootstrap/wikidata/manifest_schema.json').read_text());
          jsonschema.validate(instance=manifest, schema=schema);
          print('manifest.json validates against manifest_schema.json');
          print(f\"candidates_processed={manifest['counts']['candidates_processed']} auto_admit={manifest['counts']['auto_admit']} review_required={manifest['counts']['review_required']} not_admitted={manifest['counts']['not_admitted']}\");
          "

      - name: Replay SLICE-0017 Wikidata Tier-0 bootstrap manifest against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: >
          uv run python scripts/bootstrap/wikidata_tier0_runner.py --replay
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
          --manifest research/bootstrap/wikidata/manifest.json
          --result research/bootstrap/wikidata/REPLAY-RESULT.json

      - name: Verify bootstrap replay cleared every zero-tolerance condition
        run: >
          uv run python -c "
          import json, pathlib;
          result = json.loads(pathlib.Path('research/bootstrap/wikidata/REPLAY-RESULT.json').read_text());
          print(json.dumps(result, indent=2));
          assert result['all_zero_tolerance_conditions_clear'] is True, 'SLICE-0017 replay left a non-zero-tolerance condition unresolved'
          "

      - name: Upload bootstrap outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-outputs
          path: |
            research/bootstrap/wikidata/manifest.json
            research/bootstrap/wikidata/REPORT.md
            research/bootstrap/wikidata/REPLAY-RESULT.json
            research/bootstrap/wikidata/REPLAY-REPORT.md
          if-no-files-found: warn

      - name: Validate SLICE-0018 expansion manifest against schema
        run: >
          uv run python -c "
          import json, jsonschema, pathlib;
          manifest = json.loads(pathlib.Path('research/bootstrap/wikidata/sl0018-2500/manifest.json').read_text());
          schema = json.loads(pathlib.Path('research/bootstrap/wikidata/sl0018-2500/manifest_schema.json').read_text());
          jsonschema.validate(instance=manifest, schema=schema);
          print('SLICE-0018 manifest.json validates against manifest_schema.json');
          print(f\"delta_count={manifest['delta']['delta_count']} auto_admit={manifest['counts']['auto_admit']} review_required={manifest['counts']['review_required']} not_admitted={manifest['counts']['not_admitted']}\");
          print(f\"overlap_with_baseline={manifest['overlap']['overlap_count']} baseline_absent={manifest['overlap']['baseline_absent_count']}\");
          "

      - name: Replay SLICE-0018 baseline-first/delta-second bootstrap manifest against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: >
          uv run python scripts/bootstrap/wikidata_tier0_sl0018_runner.py --replay
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
          --baseline-manifest research/bootstrap/wikidata/manifest.json
          --manifest research/bootstrap/wikidata/sl0018-2500/manifest.json
          --result research/bootstrap/wikidata/sl0018-2500/REPLAY-RESULT.json
          --replay-report research/bootstrap/wikidata/sl0018-2500/REPLAY-REPORT.md

      - name: Verify SLICE-0018 replay cleared every zero-tolerance condition
        run: >
          uv run python -c "
          import json, pathlib;
          result = json.loads(pathlib.Path('research/bootstrap/wikidata/sl0018-2500/REPLAY-RESULT.json').read_text());
          print(json.dumps(result, indent=2));
          assert result['all_zero_tolerance_conditions_clear'] is True, 'SLICE-0018 replay left a non-zero-tolerance condition unresolved'
          "

      - name: Upload SLICE-0018 expansion outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sl0018-expansion-outputs
          path: |
            research/bootstrap/wikidata/sl0018-2500/manifest.json
            research/bootstrap/wikidata/sl0018-2500/REPORT.md
            research/bootstrap/wikidata/sl0018-2500/REPLAY-RESULT.json
            research/bootstrap/wikidata/sl0018-2500/REPLAY-REPORT.md
          if-no-files-found: warn

      - name: Validate SLICE-0021 alternative-discovery documents against schema
        run: >
          uv run python -c "
          import json, jsonschema, pathlib;
          base = pathlib.Path('research/bootstrap/wikidata/sl0021-alt-discovery');
          probe = json.loads((base / 'discovery_probe.json').read_text());
          probe_schema = json.loads((base / 'discovery_probe_schema.json').read_text());
          jsonschema.validate(instance=probe, schema=probe_schema);
          print('discovery_probe.json validates against discovery_probe_schema.json');
          sampled = json.loads((base / 'sampled_candidates.json').read_text());
          sampled_schema = json.loads((base / 'sampled_candidates_schema.json').read_text());
          jsonschema.validate(instance=sampled, schema=sampled_schema);
          print('sampled_candidates.json validates against sampled_candidates_schema.json');
          print(f\"R0={probe['drift']['current_direct_count']} drift_absent={probe['drift']['retained_direct_absent_now_count']} drift_new={probe['drift']['new_current_direct_since_sl0018_count']}\");
          print(f\"incremental: R1={probe['incremental']['R1']['count']} R2={probe['incremental']['R2']['count']} R3={probe['incremental']['R3']['count']}\");
          print(f\"route_dispositions={sampled['route_dispositions']}\");
          "

      - name: Offline-verify SLICE-0021 retained documents reproduce deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0021_alt_discovery_runner.py --verify

      - name: Upload SLICE-0021 alternative-discovery outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sl0021-alt-discovery-outputs
          path: |
            research/bootstrap/wikidata/sl0021-alt-discovery/discovery_probe.json
            research/bootstrap/wikidata/sl0021-alt-discovery/sampled_candidates.json
            research/bootstrap/wikidata/sl0021-alt-discovery/REPORT.md
          if-no-files-found: warn

      - name: Validate SLICE-0022 retained admission manifest against schema
        run: >
          uv run python -c "
          import json, jsonschema, pathlib;
          base = pathlib.Path('research/bootstrap/wikidata/sl0022-alt-route-admission');
          manifest = json.loads((base / 'manifest.json').read_text());
          schema = json.loads((base / 'manifest_schema.json').read_text());
          jsonschema.validate(instance=manifest, schema=schema);
          print('SLICE-0022 manifest.json validates against manifest_schema.json');
          print(f\"candidate_universe={manifest['candidate_universe']}\");
          print(f\"auto_admit={manifest['counts']['auto_admit']} review_required={manifest['counts']['review_required']} not_admitted={manifest['counts']['not_admitted']}\");
          print(f\"combined_canonical_boat_model_count_expected={manifest['counts']['combined_canonical_boat_model_count_expected']}\");
          "

      - name: Validate SLICE-0022 retained artifact digests against schema
        run: >
          uv run python -c "
          import json, jsonschema, pathlib;
          base = pathlib.Path('research/bootstrap/wikidata/sl0022-alt-route-admission');
          digests = json.loads((base / 'ARTIFACT-DIGESTS.json').read_text());
          schema = json.loads((base / 'artifact_digests_schema.json').read_text());
          jsonschema.validate(instance=digests, schema=schema);
          print('SLICE-0022 ARTIFACT-DIGESTS.json validates against artifact_digests_schema.json');
          "

      - name: Offline-verify SLICE-0022 retained manifest reproduces deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0022_alt_route_admission_runner.py --verify

      - name: Replay SLICE-0022 baseline-first (0017+0018) / delta-second manifest against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: >
          uv run python scripts/bootstrap/wikidata_sl0022_alt_route_admission_runner.py --replay
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
          --manifest research/bootstrap/wikidata/sl0022-alt-route-admission/manifest.json
          --result research/bootstrap/wikidata/sl0022-alt-route-admission/REPLAY-RESULT.json
          --replay-report research/bootstrap/wikidata/sl0022-alt-route-admission/REPLAY-REPORT.md

      - name: Verify SLICE-0022 replay cleared every zero-tolerance condition
        run: >
          uv run python -c "
          import json, pathlib;
          result = json.loads(pathlib.Path('research/bootstrap/wikidata/sl0022-alt-route-admission/REPLAY-RESULT.json').read_text());
          print(json.dumps(result, indent=2));
          assert result['all_zero_tolerance_conditions_clear'] is True, 'SLICE-0022 replay left a non-zero-tolerance condition unresolved'
          "

      - name: Upload SLICE-0022 admission-pilot outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sl0022-alt-route-admission-outputs
          path: |
            research/bootstrap/wikidata/sl0022-alt-route-admission/manifest.json
            research/bootstrap/wikidata/sl0022-alt-route-admission/REPORT.md
            research/bootstrap/wikidata/sl0022-alt-route-admission/ARTIFACT-DIGESTS.json
            research/bootstrap/wikidata/sl0022-alt-route-admission/REPLAY-RESULT.json
            research/bootstrap/wikidata/sl0022-alt-route-admission/REPLAY-REPORT.md
          if-no-files-found: warn

      - name: Offline-verify SLICE-0026 retained 100-BoatModel Tier-1 enrichment pilot reproduces deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0026_tier1_enrichment_pilot_runner.py --verify

      - name: Persist/replay SLICE-0026 retained 100-BoatModel pilot against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: >
          uv run python scripts/bootstrap/wikidata_sl0026_tier1_enrichment_pilot_runner.py --persist
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test

      - name: Verify SLICE-0026 persistence proof cleared every required condition
        run: >
          uv run python -c "
          import json, pathlib;
          result = json.loads(pathlib.Path('research/stage3/sl0026-wikidata-tier1-enrichment/REPLAY-RESULT.json').read_text());
          print(json.dumps(result, indent=2));
          assert result['bundle_count'] == 100, f\"expected 100 retained pilot bundles, got {result['bundle_count']}\";
          assert result['first_pass']['imported'] == 100, f\"expected 100 first imports, got {result['first_pass']['imported']}\";
          assert result['first_pass']['conflict'] == 0 and result['first_pass']['error'] == 0, 'first pass had conflicts/errors';
          assert result['readback_mismatches'] == 0, f\"expected zero readback mismatches, got {result['readback_mismatches']}\";
          assert result['reimport']['already_imported'] == 100, f\"expected 100 idempotent reimports, got {result['reimport']['already_imported']}\";
          assert result['reimport']['conflict'] == 0 and result['reimport']['error'] == 0, 'reimport had conflicts/errors';
          assert result['canonical_boat_model_row_count'] == 0, 'SLICE-0026 must never create a canonical BoatModel row';
          assert result['canonical_boat_design_row_count'] == 0, 'SLICE-0026 must never create a canonical BoatDesign row';
          assert result['clear'] is True, 'SLICE-0026 persistence proof did not clear'
          "

      - name: Offline-verify SLICE-0027 retained qualifier-shape analysis and before/after coverage reproduce deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0027_qualifier_semantics_correction_runner.py --verify

      - name: Persist/replay SLICE-0027 amended evidence for the retained 100-BoatModel sample against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: >
          uv run python scripts/bootstrap/wikidata_sl0027_qualifier_semantics_correction_runner.py --persist
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test

      - name: Verify SLICE-0027 persistence proof cleared every required condition
        run: >
          uv run python -c "
          import json, pathlib;
          result = json.loads(pathlib.Path('research/stage3/sl0027-wikidata-qualifier-semantics/REPLAY-RESULT.json').read_text());
          print(json.dumps(result, indent=2));
          assert result['bundle_count'] == 100, f\"expected 100 retained pilot bundles, got {result['bundle_count']}\";
          assert result['first_pass']['imported'] == 100, f\"expected 100 first imports, got {result['first_pass']['imported']}\";
          assert result['first_pass']['conflict'] == 0 and result['first_pass']['error'] == 0, 'first pass had conflicts/errors';
          assert result['readback_mismatches'] == 0, f\"expected zero readback mismatches, got {result['readback_mismatches']}\";
          assert result['reimport']['already_imported'] == 100, f\"expected 100 idempotent reimports, got {result['reimport']['already_imported']}\";
          assert result['reimport']['conflict'] == 0 and result['reimport']['error'] == 0, 'reimport had conflicts/errors';
          assert result['canonical_boat_model_row_count'] == 0, 'SLICE-0027 must never create a canonical BoatModel row';
          assert result['canonical_boat_design_row_count'] == 0, 'SLICE-0027 must never create a canonical BoatDesign row';
          assert result['clear'] is True, 'SLICE-0027 persistence proof did not clear'
          "

      - name: Offline-verify SLICE-0028 retained full-boundary linkage/evidence/coverage reproduce deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0028_full_boundary_evidence_runner.py --verify

      - name: Persist/replay SLICE-0028 retained full-boundary evidence against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: >
          uv run python scripts/bootstrap/wikidata_sl0028_full_boundary_evidence_runner.py --persist
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test

      - name: Verify SLICE-0028 persistence proof cleared every required condition
        run: >
          uv run python -c "
          import json, pathlib;
          result = json.loads(pathlib.Path('research/stage3/sl0028-wikidata-tier1-full-boundary/REPLAY-RESULT.json').read_text());
          print(json.dumps(result, indent=2));
          assert result['bundle_count'] == 1770, f\"expected 1770 retained full-boundary bundles, got {result['bundle_count']}\";
          assert result['first_pass']['imported'] == result['bundle_count'], f\"expected {result['bundle_count']} first imports, got {result['first_pass']['imported']}\";
          assert result['first_pass']['conflict'] == 0 and result['first_pass']['error'] == 0, 'first pass had conflicts/errors';
          assert result['readback_mismatches'] == 0, f\"expected zero readback mismatches, got {result['readback_mismatches']}\";
          assert result['reimport']['already_imported'] == result['bundle_count'], f\"expected {result['bundle_count']} idempotent reimports, got {result['reimport']['already_imported']}\";
          assert result['reimport']['conflict'] == 0 and result['reimport']['error'] == 0, 'reimport had conflicts/errors';
          assert result['canonical_boat_model_row_count'] == 0, 'SLICE-0028 must never create a canonical BoatModel row';
          assert result['canonical_boat_design_row_count'] == 0, 'SLICE-0028 must never create a canonical BoatDesign row';
          assert result['clear'] is True, 'SLICE-0028 persistence proof did not clear'
          "

      - name: Offline-verify SLICE-0030 retained mass-unit assessment and before/after coverage reproduce deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0030_mass_unit_correction_runner.py --verify

      - name: Persist/replay SLICE-0030 corrected full-boundary evidence against PostgreSQL 18
        env:
          HULLQ_TEST_DATABASE_URL: postgresql://hullq_test:hullq_test@localhost:5432/hullq_test
        run: >
          uv run python scripts/bootstrap/wikidata_sl0030_mass_unit_correction_runner.py --persist
          --db-url postgresql://hullq_test:hullq_test@localhost:5432/hullq_test

      - name: Verify SLICE-0030 persistence proof cleared every required condition
        run: >
          uv run python -c "
          import json, pathlib;
          result = json.loads(pathlib.Path('research/stage3/sl0030-wikidata-mass-unit-correction/REPLAY-RESULT.json').read_text());
          print(json.dumps(result, indent=2));
          assert result['bundle_count'] == 1770, f\"expected 1770 retained full-boundary bundles, got {result['bundle_count']}\";
          assert result['first_pass']['imported'] == result['bundle_count'], f\"expected {result['bundle_count']} first imports, got {result['first_pass']['imported']}\";
          assert result['first_pass']['conflict'] == 0 and result['first_pass']['error'] == 0, 'first pass had conflicts/errors';
          assert result['readback_mismatches'] == 0, f\"expected zero readback mismatches, got {result['readback_mismatches']}\";
          assert result['reimport']['already_imported'] == result['bundle_count'], f\"expected {result['bundle_count']} idempotent reimports, got {result['reimport']['already_imported']}\";
          assert result['reimport']['conflict'] == 0 and result['reimport']['error'] == 0, 'reimport had conflicts/errors';
          assert result['canonical_boat_model_row_count'] == 0, 'SLICE-0030 must never create a canonical BoatModel row';
          assert result['canonical_boat_design_row_count'] == 0, 'SLICE-0030 must never create a canonical BoatDesign row';
          assert result['clear'] is True, 'SLICE-0030 persistence proof did not clear'
          "

      - name: Offline-verify SLICE-0031 retained corrected Tier-1 evidence profile and positive-control candidates reproduce deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0031_corrected_tier1_evidence_profile_runner.py --verify

      - name: Offline-verify SLICE-0032 retained sequential positive-control pilot package reproduces deterministically (no network)
        run: >
          uv run python scripts/bootstrap/wikidata_sl0032_sequential_positive_control_pilot_runner.py --verify

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.14"

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Audit environment
        run: uv run pip-audit
